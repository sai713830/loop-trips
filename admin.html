<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — Loop Trips</title>
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="googlebot" content="noindex,nofollow,noarchive">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
  <script src="/js/brand-assets.js"></script>
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div id="app-view" class="admin-shell">
    <aside class="admin-side">
      <div class="brand">
        <img src="/img/logo.png" alt="Loop Trips" class="brand-logo" height="52" width="auto">
        <small>Content admin</small>
      </div>
      <nav class="admin-nav" id="nav">
        <button type="button" data-view="packages" class="on">Packages</button>
        <button type="button" data-view="collections">Collections</button>
        <button type="button" data-view="brand">Brand</button>
        <button type="button" data-view="home">Homepage</button>
        <button type="button" data-view="bookings">Submissions</button>
        <button type="button" data-view="settings">Settings</button>
        <button type="button" data-view="live">How to use</button>
      </nav>
      <div class="side-foot">
        <a href="/" target="_blank" rel="noopener">Open public site</a>
        <button type="button" id="logout-btn">Log out</button>
      </div>
    </aside>

    <main class="admin-main">
      <div id="view-root"></div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/js/data.js"></script>
  <script src="/js/content.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
